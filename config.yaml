---
  FOLDER_SCAN: "/path/to/scan/folder/"
  FOLDER_TOD_OUTPUT: "/path/to/tod/output/folder/"
  path_to_map: "/path/to/map/skymap.fits" # has I,Q,U maps
  # Which Stokes components to read from the FITS map.
  # Subset of [0, 1, 2] (= [T, Q, U]). Use [0] for a temperature-only map —
  # the pipeline then skips the spin-2 Q/U frame rotation and writes zeros for
  # the Q/U rows of the output TOD. Output shape stays (3, n_samples).
  map_fields: [0, 1, 2]

  # beam files setup
  # Only the entries whose index appears in map_fields are required. Entries
  # for inactive components may be omitted or set to null.
  FOLDER_BEAM: "/path/to/beam/folder/"
  beam_file_I: "beam_pixel_map_I.fits"
  beam_file_Q: "beam_pixel_map_Q.fits"
  beam_file_U: "beam_pixel_map_U.fits"
  power_fraction_threshold_I: 1.00 # threshold for including beam pixels in the convolution
  power_fraction_threshold_Q: 1.00
  power_fraction_threshold_U: 1.00
  # Row (x) and column (y) index of the beam centre pixel in the beam matrix.
  # null → use H // 2 and W // 2 (centre of the array).
  beam_center_x: null
  beam_center_y: null

  start_day: 0
  end_day: 366
  # multiprocessing parameters
  n_processes: 6
  # calibration cache — set by the calibration run, disabled on subsequent runs
  # set calibration_enabled: false to force using the cached values below
  calibration_enabled: true
  calibration_n_processes: null
  calibration_numba_threads: null   # threads per worker (Numba prange).
  calibration_batch_size: null
  # Hard upper bound on n_processes the calibrator may pick.
  # Defaults to n_processes above. Set lower if you want to keep cores free.
  # beam grid interpolation method — choose one of:
  #   'nearest'  — single nearest-pixel lookup (fastest, no mixing between pixels)
  #   'bilinear' — 4-pixel bilinear HEALPix interpolation (default, fast Numba kernel)
  #   'gaussian' — isotropic Gaussian kernel (slowest, avoids grid-aligned artefacts)
  # sigma and radius are only used for 'gaussian' and default to 1× and 3× the
  # HEALPix pixel resolution respectively.
  beam_interp_method: 'bilinear'
  # Spin-2 Q/U correction skip optimisation.
  # The spin-2 frame rotation is negligible near the equator and grows toward
  # the poles. With this enabled (tol > 0), the correction is bypassed when
  # the boresight is in the equatorial band, where the per-sample fractional
  # Q/U error introduced by skipping is bounded by `spin2_skip_tolerance`.
  # Set to null or 0 to disable (always apply the correction).
  # Recommended: 0.01 (1%) — well below typical scan-noise levels.
  spin2_skip_tolerance: null
  # beam pixel clustering — k-means on the unit sphere to reduce pixel count
  # before TOD generation.  Only the low-power tail is clustered; the main
  # lobe is kept pixel-exact.
  #
  # Quickstart:
  #   1. Set clustering_calibration_enabled: true and run once.
  #      The calibration sweeps a (tail_fraction × n_clusters) grid, selects
  #      the pair that maximises speedup while keeping B_ell divergence below
  #      clustering_error_threshold, saves the result, and resets the flag.
  #   2. On all subsequent runs the saved values are used directly.
  #
  # Manual override: set clustering_calibration_enabled: false and fill in
  #   n_beam_clusters and beam_cluster_tail_fraction by hand.
  # Disable entirely: set n_beam_clusters: null.
  n_beam_clusters: null               # int → enable; null → no clustering
  beam_cluster_tail_fraction: null    # fraction of beam power treated as tail
  clustering_calibration_enabled: false
  # Maximum tolerated relative RMS divergence in the beam transfer function
  # B_ell between the clustered and reference (unclustered) beam.  The
  # calibration picks the fastest (tail_fraction, n_clusters) pair whose
  # B_ell divergence does not exceed this value.
  clustering_error_threshold: 1.0e-5
  # Working precision for the float32-side of the pipeline (sky map, pointings,
  # beam values, Rodrigues rotation, saved TOD). Float64 surfaces (bilinear
  # weights, spin-2 cache, accumulators, B_ell) are unchanged either way.
  # 'float32' (default) matches legacy behaviour; 'float64' is a precision
  # validation knob — slower and uses more memory but isolates whether
  # high-ell residuals are precision-limited.
  precision: 'float32'
  # Half-wave plate (HWP) modulation.
  # When enabled, the TOD generator rotates the per-sample (Q, U) output by
  # 4·φ_HWP(t), where φ_HWP(t) = 2π · hwp_rotation_frequency_hz · t +
  # hwp_initial_phase_rad and t is seconds since the start of day 0
  # (continuous across days). The rotation applied is:
  #     Q' =  Q·cos(4φ) + U·sin(4φ)
  #     U' = −Q·sin(4φ) + U·cos(4φ)
  # so that downstream mapmakers still combine the detector signal as
  #     d = T + Q'·cos(2ψ) + U'·sin(2ψ).
  # The HWP affects polarization angle only, not beam shape — it is applied
  # after beam convolution and does NOT alter the Rodrigues rotation.
  hwp_enabled: false
  hwp_rotation_frequency_hz: 0.0     # physical HWP rotation rate f_HWP [Hz]
  hwp_initial_phase_rad: 0.0         # φ₀ at t = 0 (start of day 0) [rad]
  # Multiprocessing start method: 'spawn' (safe, default) or 'fork' (faster on Linux).
  # 'fork' avoids re-running Numba JIT compilation in each worker but may deadlock
  # on macOS. Only change this if you have verified it is safe on your platform.
  mp_start_method: 'spawn'